# Mirrors what Render does on a deploy, so a green CI run means the deploy builds.
# Same Node version (.nvmrc), same NODE_ENV, same install flags.
#
# Runs on every branch push and exactly once per commit — see the `if:` on the
# job for why `pull_request` is declared but usually skipped.
name: CI

on:
  # Every branch, not just main: a feature branch that only gets checked when
  # someone opens a PR is a branch whose first red run arrives after the work is
  # finished. `'**'` is branches only — a tag push would re-run a commit that
  # already ran here.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skip the duplicate: once a PR is open, a push to its branch fires both
    # `push` and `pull_request` and would run this twice on one commit. The push
    # run is the one that survives — check runs attach to the SHA, so it still
    # shows in the PR's checks. Fork PRs have no push event in this repo, so
    # they keep their `pull_request` run; that is what the second clause is for,
    # and dropping `pull_request` entirely would leave them unchecked.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # --include=dev is required: with NODE_ENV=production a plain `npm ci`
      # skips devDependencies and both builds fail on missing toolchain.
      - run: npm ci --include=dev

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # The static export is a second, separate build: STATIC_EXPORT=1 switches
      # Next to `output: 'export'`. The API built above is what it fetches the
      # catalogue from — `apps/web/scripts/build.mjs` starts it on a free port.
      - name: Verify static export
        env:
          STATIC_EXPORT: '1'
        run: |
          npm run build --workspace @discopod/web
          # `/` is the pair chooser: no catalogue on it, one link per pair.
          test -f apps/web/out/index.html
          grep -q '繁體中文' apps/web/out/index.html
          # One page per pair, and the pair really is a route segment (ADR 0003).
          test -f apps/web/out/en/en.html
          test -f apps/web/out/zh-Hant/en.html
          # The catalogue really came from the API, not from a file in apps/web:
          # episode 7 is the one verified row left in the seed (ADR 0004), and
          # the fit percentage is computed by the API's ranker, never authored.
          test -f apps/web/out/en/en/episode/7.html
          grep -q '% fit' apps/web/out/en/en.html

      # Boot the API and check the health endpoint Render will probe.
      - name: Smoke test the API
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            sleep 1
            curl -fsS http://localhost:3001/api/health && break
          done
          curl -fsS "http://localhost:3001/api/episodes/start-here?level=Beginner" > /dev/null
